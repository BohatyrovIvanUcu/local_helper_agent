name: Build and Release .deb

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build Debian (.deb) Package
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build Debian package
        run: npm run build:deb

      - name: Inspect generated package
        run: |
          ls -lh releases/
          dpkg -c releases/local-helper-ai_0.1.0_amd64.deb

      - name: Upload .deb package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-helper-ai-deb
          path: releases/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Determine tag and release title
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TITLE=Local Helper Mascot $TAG" >> $GITHUB_OUTPUT

      - name: Create or update Git Tag
        run: |
          TAG="${{ steps.release_info.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin -f "$TAG" || true

      - name: Publish GitHub Release with .deb asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.TAG }}"
          TITLE="${{ steps.release_info.outputs.TITLE }}"
          
          echo "Creating / updating release for $TAG ($TITLE)..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Реліз $TAG вже існує. Оновлюємо опис та бінарний файл .deb..."
            gh release upload "$TAG" releases/*.deb --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file releases/RELEASE_TEMPLATE.md
          else
            echo "Створюємо новий GitHub Release $TAG..."
            gh release create "$TAG" releases/*.deb \
              --title "$TITLE" \
              --notes-file releases/RELEASE_TEMPLATE.md
          fi
