name: Build and Release Multiplatform

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform.name }})
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Linux (deb)
            os: ubuntu-22.04
            bundle: deb
            artifact_pattern: src-tauri/target/release/bundle/deb/*.deb
            artifact_name: local-helper-ai-linux-deb

          - name: Windows (exe)
            os: windows-latest
            bundle: nsis
            artifact_pattern: src-tauri/target/release/bundle/nsis/*.exe
            artifact_name: local-helper-ai-windows-exe

          - name: macOS (dmg)
            os: macos-latest
            bundle: dmg
            artifact_pattern: src-tauri/target/release/bundle/dmg/*.dmg
            artifact_name: local-helper-ai-macos-dmg

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundle
        run: npx tauri build --bundles ${{ matrix.platform.bundle }}

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ matrix.platform.artifact_pattern }}
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Multiplatform Release
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f \( -name "*.deb" -o -name "*.exe" -o -name "*.dmg" \) -exec cp {} release-files/ \;
          echo "Зібрані релізні файли:"
          ls -lh release-files/

      - name: Determine tag and release title
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="v$VERSION"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "TITLE=Local Helper Mascot $TAG" >> $GITHUB_OUTPUT

      - name: Create or update Git Tag
        run: |
          TAG="${{ steps.release_info.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin -f "$TAG" || true

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_info.outputs.TAG }}"
          TITLE="${{ steps.release_info.outputs.TITLE }}"
          
          echo "Creating / updating release for $TAG ($TITLE)..."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Реліз $TAG вже існує. Оновлюємо файли та опис..."
            gh release upload "$TAG" release-files/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file releases/RELEASE_TEMPLATE.md
          else
            echo "Створюємо новий GitHub Release $TAG..."
            gh release create "$TAG" release-files/* \
              --title "$TITLE" \
              --notes-file releases/RELEASE_TEMPLATE.md
          fi
