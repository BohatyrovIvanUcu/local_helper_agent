[package]
name = "local-helper-ai"
version = "0.3.0"
description = "Desktop AI Mascot Assistant powered by Tauri v2 and Gemini API"
authors = ["Ivan"]
edition = "2021"

[lib]
name = "local_helper_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"

